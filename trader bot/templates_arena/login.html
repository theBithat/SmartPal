{% extends "base.html" %}

{% block title %}Login - SmartPal Arena{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="arena-card rounded-xl p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <span class="text-5xl">⚔️</span>
            <h1 class="font-display text-3xl font-bold text-gold-gradient mt-4">Enter the Arena</h1>
            <p class="text-gray-400 mt-2">Login to command your trading gods</p>
        </div>
        
        <form id="login-form" class="space-y-6">
            <div>
                <label class="block text-gray-300 mb-2">Username or Email</label>
                <input type="text" id="username" required
                    class="w-full px-4 py-3 rounded-lg bg-white/5 border border-arena-gold/20 text-white focus:border-arena-gold focus:outline-none transition"
                    placeholder="Enter your username">
            </div>
            
            <div>
                <label class="block text-gray-300 mb-2">Password</label>
                <input type="password" id="password" required
                    class="w-full px-4 py-3 rounded-lg bg-white/5 border border-arena-gold/20 text-white focus:border-arena-gold focus:outline-none transition"
                    placeholder="Enter your password">
            </div>
            
            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center text-gray-400">
                    <input type="checkbox" class="mr-2 rounded bg-white/5 border-arena-gold/20">
                    Remember me
                </label>
                <a href="#" class="text-arena-gold hover:underline">Forgot password?</a>
            </div>
            
            <div id="error-message" class="hidden text-arena-red text-center p-3 bg-arena-red/10 rounded-lg"></div>
            
            <button type="submit" class="w-full btn-arena py-3 rounded-lg text-lg">
                <i class="fas fa-sign-in-alt mr-2"></i>
                Enter Arena
            </button>
        </form>
        
        <div class="mt-8 text-center">
            <p class="text-gray-400">
                New warrior? 
                <a href="/arena/register" class="text-arena-gold hover:underline">Join the Arena</a>
            </p>
        </div>
        
        <div class="mt-6 pt-6 border-t border-arena-gold/10">
            <p class="text-center text-gray-500 text-sm mb-4">Or continue with</p>
            <div class="flex justify-center space-x-4">
                <button class="px-6 py-2 rounded-lg bg-white/5 border border-arena-gold/20 text-gray-300 hover:border-arena-gold transition">
                    <i class="fab fa-google mr-2"></i>Google
                </button>
                <button class="px-6 py-2 rounded-lg bg-white/5 border border-arena-gold/20 text-gray-300 hover:border-arena-gold transition">
                    <i class="fab fa-discord mr-2"></i>Discord
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('error-message');
    
    errorDiv.classList.add('hidden');
    
    try {
        const response = await fetch('/api/arena/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        
        const result = await response.json();
        
        if (result.success) {
            localStorage.setItem('arena_token', result.access_token);
            localStorage.setItem('arena_refresh', result.refresh_token);
            
            // Check if user has completed onboarding
            if (result.onboarding_completed === false) {
                window.location.href = '/arena/onboarding';
            } else {
                window.location.href = '/arena/god-control';
            }
        } else {
            errorDiv.textContent = result.error || 'Login failed';
            errorDiv.classList.remove('hidden');
        }
    } catch (error) {
        errorDiv.textContent = 'Connection error. Please try again.';
        errorDiv.classList.remove('hidden');
    }
});
</script>
{% endblock %}
